<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spider-Man Universe vs Dragon Ball Super: Multiverse Evolution 3D</title>

    <style>

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

            user-select: none;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        }

        body, html {

            width: 100%;

            height: 100%;

            overflow: hidden;

            background-color: #000;

            color: #fff;

        }

        #webgl-container {

            width: 100%;

            height: 100%;

            position: absolute;

            top: 0;

            left: 0;

            z-index: 1;

        }

        /* PS3 Glassmorphism UI Base */

        .glass-panel {

            background: rgba(15, 23, 42, 0.55);

            backdrop-filter: blur(16px);

            -webkit-backdrop-filter: blur(16px);

            border: 1px solid rgba(255, 255, 255, 0.15);

            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);

            border-radius: 12px;

        }

        /* HUD Overlay */

        #hud-layer {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            z-index: 10;

            pointer-events: none;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            padding: 20px 40px;

        }

        .top-hud {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            width: 100%;

        }

        .player-status {

            width: 42%;

            display: flex;

            flex-direction: column;

            gap: 6px;

        }

        .player-info {

            display: flex;

            justify-content: space-between;

            align-items: center;

            font-weight: 800;

            font-size: 18px;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            text-shadow: 0 2px 4px rgba(0,0,0,0.8);

        }

        .bar-container {

            height: 22px;

            width: 100%;

            background: rgba(0,0,0,0.6);

            border: 1px solid rgba(255,255,255,0.2);

            border-radius: 4px;

            overflow: hidden;

            position: relative;

        }

        .health-bar {

            height: 100%;

            width: 100%;

            background: linear-gradient(90deg, #10b981 0%, #059669 100%);

            transition: width 0.15s ease-out;

        }

        .ki-bar {

            height: 12px;

            width: 0%;

            background: linear-gradient(90deg, #3b82f6 0%, #1d4ed8 100%);

            transition: width 0.1s linear;

        }

        .p2-align {

            align-items: flex-end;

        }

        .p2-bar-dir {

            direction: rtl;

        }

        .timer-box {

            padding: 10px 24px;

            font-size: 36px;

            font-weight: 900;

            color: #fbbf24;

            border-radius: 8px;

            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);

        }

        /* Character Selection Menu */

        #selection-screen {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            z-index: 20;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: space-between;

            padding: 30px;

            background: radial-gradient(circle at center, rgba(15,23,42,0.7) 0%, rgba(0,0,0,0.95) 100%);

        }

        .menu-title {

            font-size: 32px;

            font-weight: 900;

            letter-spacing: 3px;

            text-transform: uppercase;

            background: linear-gradient(90deg, #ef4444, #3b82f6);

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            margin-bottom: 10px;

        }

        .roster-grid {

            display: grid;

            grid-template-columns: repeat(10, 1fr);

            gap: 10px;

            width: 90%;

            max-width: 1200px;

            max-height: 60vh;

            overflow-y: auto;

            padding: 15px;

        }

        .roster-card {

            aspect-ratio: 1;

            background: rgba(255,255,255,0.05);

            border: 1px solid rgba(255,255,255,0.1);

            border-radius: 6px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            font-size: 11px;

            font-weight: 700;

            text-align: center;

            cursor: pointer;

            transition: all 0.2s ease;

            padding: 4px;

        }

        .roster-card:hover, .roster-card.selected-p1 {

            border-color: #ef4444;

            box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);

            transform: scale(1.08);

            background: rgba(239, 68, 68, 0.2);

        }

        .roster-card.selected-p2 {

            border-color: #3b82f6;

            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);

            transform: scale(1.08);

            background: rgba(59, 130, 246, 0.2);

        }

        .start-btn {

            pointer-events: auto;

            padding: 14px 48px;

            font-size: 20px;

            font-weight: 800;

            text-transform: uppercase;

            color: #fff;

            background: linear-gradient(90deg, #dc2626, #2563eb);

            border: none;

            border-radius: 30px;

            cursor: pointer;

            box-shadow: 0 4px 20px rgba(0,0,0,0.5);

            transition: transform 0.2s, box-shadow 0.2s;

        }

        .start-btn:hover {

            transform: scale(1.05);

            box-shadow: 0 6px 30px rgba(37, 99, 235, 0.6);

        }

        /* Move List / Controls Overlay */

        .controls-hint {

            position: absolute;

            bottom: 20px;

            left: 40px;

            font-size: 12px;

            color: rgba(255,255,255,0.6);

            display: flex;

            gap: 20px;

        }

    </style>

    <!-- Three.js Engine & Dependencies -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

</head>

            { id: "broly_ssj", name: "Broly (FP Super Saiyan)", universe: "DBSuper", color: 0x15803d, hair: "saiyan_green", accessory: "none" },

            { id: "caulifla", name: "Caulifla (SSJ2)", universe: "DBSuper", color: 0x831843, hair: "saiyan_gold", accessory: "none" },

            { id: "kale", name: "Kale (Berserk SSJ)", universe: "DBSuper", color: 0x166534, hair: "saiyan_green", accessory: "none" },

            { id: "kefla", name: "Kefla (SSJ2)", universe: "DBSuper", color: 0x15803d, hair: "saiyan_green", accessory: "none" },

            { id: "toppo", name: "Toppo (God of Destruction)", universe: "DBSuper", color: 0x831843, hair: false, accessory: "none" },

            { id: "dyspo", name: "Dyspo", universe: "DBSuper", color: 0xbe123c, hair: false, accessory: "none" },

            { id: "moro", name: "Moro", universe: "DBSuper", color: 0x334155, hair: false, accessory: "none" },

            { id: "granolah", name: "Granolah", universe: "DBSuper", color: 0x047857, hair: "green_spiky", accessory: "none" },

            { id: "gogeta_blue", name: "Gogeta (SSGSS)", universe: "DBSuper", color: 0x0284c7, hair: "saiyan_blue", accessory: "none" }

        ];

        // Global Game State

        let selectedP1 = ROSTER[0];

        let selectedP2 = ROSTER[26]; // Goku SSGSS default P2

        let scene, camera, renderer, clock;

        let player1, player2;

        let gameActive = false;

        let matchTime = 99;

        // Key states

        const keys = {};

        // Voice Synthesis Engine

        function speak(text) {

            if ('speechSynthesis' in window) {

                const utterance = new SpeechSynthesisUtterance(text);

                utterance.pitch = 0.8;

                utterance.rate = 1.1;

                window.speechSynthesis.speak(utterance);

            }

        }

        // Initialize Character Selection UI

        function initRosterUI() {

            const container = document.getElementById('roster-container');

            ROSTER.forEach((char, index) => {

                const card = document.createElement('div');

                card.className = 'roster-card';

                card.innerText = char.name;

                card.onclick = () => {

                    selectedP1 = char;

                    updateRosterSelection();

                    speak(char.name);

                };

                container.appendChild(card);

            });

            updateRosterSelection();

        }

        function updateRosterSelection() {

            const cards = document.querySelectorAll('.roster-card');

            cards.forEach((card, idx) => {

                card.classList.remove('selected-p1', 'selected-p2');

                if (ROSTER[idx].id === selectedP1.id) card.classList.add('selected-p1');

                if (ROSTER[idx].id === selectedP2.id) card.classList.add('selected-p2');

            });

            document.getElementById('p1-name').innerText = selectedP1.name;

            document.getElementById('p2-name').innerText = selectedP2.name;

        }

        // --- THREE.JS 3D ENGINE SETUP ---

        function init3DEngine() {

            const container = document.getElementById('webgl-container');

            scene = new THREE.Scene();

            scene.fog = new THREE.FogExp2(0x0a0e17, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            camera.position.set(0, 5, 14);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });

            renderer.setSize(window.innerWidth, window.innerHeight);

            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            renderer.shadowMap.enabled = true;

            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            renderer.toneMapping = THREE.ACESFilmicToneMapping;

            renderer.toneMappingExposure = 1.2;

            container.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // PBR Environment & Lighting

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);

            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfff5ea, 1.5);

            dirLight.position.set(20, 40, 20);

            dirLight.castShadow = true;

            dirLight.shadow.mapSize.width = 2048;

            dirLight.shadow.mapSize.height = 2048;

            dirLight.shadow.camera.near = 0.5;

            dirLight.shadow.camera.far = 100;

            const d = 20;

            dirLight.shadow.camera.left = -d;

            dirLight.shadow.camera.right = d;

            dirLight.shadow.camera.top = d;

            dirLight.shadow.camera.bottom = -d;

            scene.add(dirLight);

            // Tournament Stage Floor Grid

            const gridHelper = new THREE.GridHelper(60, 40, 0xef4444, 0x3b82f6);

            gridHelper.position.y = 0;

            scene.add(gridHelper);

            const stageGeo = new THREE.CylinderGeometry(30, 32, 2, 64);

            const stageMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3, metalness: 0.8 });

            const stage = new THREE.Mesh(stageGeo, stageMat);

            stage.position.y = -1;

            stage.receiveShadow = true;

            scene.add(stage);

            window.addEventListener('resize', onWindowResize);

        }

        function onWindowResize() {

            camera.aspect = window.innerWidth / window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);

        }

        // --- ARTICULATED HUMANOID RIG GENERATOR ---

        function createArticulatedFighter(config, isP2 = false) {

            const group = new THREE.Group();

            

            // PBR Base Material

            const bodyMat = new THREE.MeshStandardMaterial({ 

                color: config.color, 

                roughness: 0.4, 

                metalness: 0.3 

            });

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.6 });

            // Torso

            const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.6, 0.6), bodyMat);

            torso.position.y = 2.6;

            torso.castShadow = true;

            group.add(torso);

            // Head

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), skinMat);

            head.position.set(0, 1.2, 0);

            head.castShadow = true;

            torso.add(head);

            // Hair System Setup

            if (config.hair) {

                const hairMat = new THREE.MeshStandardMaterial({ 

                    color: config.hair.includes('blue') ? 0x00d2ff : config.hair.includes('gold') ? 0xffd700 : config.hair.includes('silver') ? 0xe2e8f0 : 0x111111,

                    roughness: 0.2,

                    emissive: config.hair.includes('blue') ? 0x0044aa : 0x000000,

                    emissiveIntensity: 0.5

                });

                const hairGeo = new THREE.ConeGeometry(0.5, 1.2, 5);

                const hair = new THREE.Mesh(hairGeo, hairMat);

                hair.rotation.x = -0.4;

                hair.position.set(0, 0.4, -0.1);

                head.add(hair);

            }

            // Custom Accessories Setup

            if (config.accessory === "spider_legs") {

                for (let i = 0; i < 4; i++) {

                    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2), bodyMat);

                    leg.position.set(i % 2 === 0 ? 0.8 : -0.8, 0.2, -0.4);

                    leg.rotation.z = (i % 2 === 0 ? 1 : -1) * 0.8;

                    torso.add(leg);

                }

            } else if (config.accessory === "tentacles") {

                for (let i = 0; i < 4; i++) {

                    const tentacle = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.06, 8, 24), bodyMat);

                    tentacle.position.set(i % 2 === 0 ? 0.6 : -0.6, 0, -0.5);

                    torso.add(tentacle);

                }

            } else if (config.accessory === "glider") {

                const glider = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 1.2), new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.9 }));

                glider.position.set(0, -1.2, 0);

                torso.add(glider);

            }

            // Arms & 5-Finger Hand Hierarchy

            const armGeo = new THREE.CylinderGeometry(0.18, 0.15, 0.8);

            const handGeo = new THREE.BoxGeometry(0.2, 0.2, 0.1);

            ['left', 'right'].forEach(side => {

                const isLeft = side === 'left';

                const arm = new THREE.Mesh(armGeo, bodyMat);

                arm.position.set(isLeft ? 0.8 : -0.8, 0.5, 0);

                torso.add(arm);

                const hand = new THREE.Mesh(handGeo, skinMat);

                hand.position.set(0, -0.5, 0);

                arm.add(hand);

                // 5 Articulated Fingers

                for (let f = 0; f < 5; f++) {

                    const finger = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.12, 0.03), skinMat);

                    finger.position.set(-0.08 + (f * 0.04), -0.1, 0);

                    hand.add(finger);

                }

            });

            // Legs

            const legGeo = new THREE.CylinderGeometry(0.22, 0.18, 1.0);

            ['left', 'right'].forEach(side => {

                const isLeft = side === 'left';

                const leg = new THREE.Mesh(legGeo, bodyMat);

                leg.position.set(isLeft ? 0.35 : -0.35, -1.1, 0);

                torso.add(leg);

            });

            // Energy Particle Aura System

            const auraGeo = new THREE.BufferGeometry();

            const count = 150;

            const posArray = new Float32Array(count * 3);

            for(let i=0; i<count*3; i++) {

                posArray[i] = (Math.random() - 0.5) * 3;

            }

            auraGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

            const auraMat = new THREE.PointsMaterial({

                size: 0.15,

                color: config.universe === "DBSuper" ? 0x00d2ff : 0xef4444,

                transparent: true,

                opacity: 0.8,

                blending: THREE.AdditiveBlending

            });

            const auraParticles = new THREE.Points(auraGeo, auraMat);

            auraParticles.visible = false;

            group.add(auraParticles);

            group.position.x = isP2 ? 4 : -4;

            scene.add(group);

            return {

                mesh: group,

                torso: torso,

                aura: auraParticles,

                config: config,

                hp: 100,

                ki: 0,

                isFlying: false,

                isCharging: false,

                velocity: new THREE.Vector3(),

                isP2: isP2

            };

        }

        // --- GAME LOOP & COMBAT LOGIC ---

        function startMatch() {

            document.getElementById('selection-screen').style.display = 'none';

            if (player1) scene.remove(player1.mesh);

            if (player2) scene.remove(player2.mesh);

            player1 = createArticulatedFighter(selectedP1, false);

            player2 = createArticulatedFighter(selectedP2, true);

            gameActive = true;

            matchTime = 99;

            speak("Ready... Fight!");

        }

        // Key Listener Registration

        window.addEventListener('keydown', e => keys[e.code] = true);

        window.addEventListener('keyup', e => keys[e.code] = false);

        function handleInput() {

            if (!gameActive || !player1) return;

|---|

            const speed = 0.15;

            player1.isCharging = false;

            // Flight Logic (DBSuper/Spider-Man Flight Movement)

            if (keys['KeyW']) player1.mesh.position.z -= speed;

            if (keys['KeyS']) player1.mesh.position.z += speed;

            if (keys['KeyA']) player1.mesh.position.x -= speed;

            if (keys['KeyD']) player1.mesh.position.x += speed;

            // Jump / Vertical Flight

            if (keys['Space']) {

                player1.mesh.position.y += speed;

                player1.isFlying = player1.mesh.position.y > 0.1;

            } else if (player1.mesh.position.y > 0 && !keys['KeyW']) {

                // Gravity if not holding ascend

                if (!player1.isFlying) player1.mesh.position.y = Math.max(0, player1.mesh.position.y - 0.1);

            }

            // Power Charge Mechanics

            if (keys['KeyI']) {

                player1.isCharging = true;

                player1.ki = Math.min(100, player1.ki + 0.8);

                player1.aura.visible = true;

                player1.aura.rotation.y += 0.1;

            } else {

                player1.aura.visible = false;

            }

            // Attacks

            if (keys['KeyJ']) executeAttack(player1, player2, 'light');

            if (keys['KeyK']) executeAttack(player1, player2, 'heavy');

            if (keys['KeyL']) executeEnergyBlast(player1, player2);

            // Update UI State Displays

            document.getElementById('p1-state').innerText = player1.isFlying ? "AIRBORNE" : "GROUNDED";

            document.getElementById('p1-hp').style.width = player1.hp + '%';

            document.getElementById('p1-ki').style.width = player1.ki + '%';

        }

        function executeAttack(attacker, defender, type) {

            const dist = attacker.mesh.position.distanceTo(defender.mesh.position);

            if (dist < 2.5) {

                const damage = type === 'light' ? 0.4 : 0.9;

                defender.hp = Math.max(0, defender.hp - damage);

                defender.mesh.position.x += attacker.isP2 ? -0.1 : 0.1; // Knockback

            }

        }

        function executeEnergyBlast(attacker, defender) {

            if (attacker.ki < 20) return;

            attacker.ki -= 20;

            // Create Ki Blast / Web Projectile Mesh

            const projGeo = new THREE.SphereGeometry(0.3, 16, 16);

            const projMat = new THREE.MeshBasicMaterial({ 

                color: attacker.config.universe === "DBSuper" ? 0x3b82f6 : 0xffffff 

            });

            const proj = new THREE.Mesh(projGeo, projMat);

            proj.position.copy(attacker.mesh.position);

            scene.add(proj);

            const targetPos = defender.mesh.position.clone();

            const anim = setInterval(() => {

                proj.position.lerp(targetPos, 0.2);

                if (proj.position.distanceTo(targetPos) < 0.5) {

                    defender.hp = Math.max(0, defender.hp - 8);

                    scene.remove(proj);

                    clearInterval(anim);

                }

            }, 16);

        }

        // Basic Combat AI Loop for P2

        function updateAI() {

            if (!gameActive || !player2 || !player1) return;

            const dist = player2.mesh.position.distanceTo(player1.mesh.position);

            

            // AI Movement

            if (dist > 2.0) {

                player2.mesh.position.x += (player1.mesh.position.x - player2.mesh.position.x) * 0.02;

                player2.mesh.position.z += (player1.mesh.position.z - player2.mesh.position.z) * 0.02;

            } else {

                // AI Combat

                executeAttack(player2, player1, Math.random() > 0.5 ? 'light' : 'heavy');

            }

            // AI Energy Logic

            if (player2.ki < 30 && Math.random() < 0.02) {

                player2.ki += 10;

            } else if (player2.ki >= 20 && dist > 5.0 && Math.random() < 0.01) {

                executeEnergyBlast(player2, player1);

            }

            // Update P2 HUD

            document.getElementById('p2-hp').style.width = player2.hp + '%';

            document.getElementById('p2-ki').style.width = player2.ki + '%';

            document.getElementById('p2-state').innerText = player2.isFlying ? "AIRBORNE" : "GROUNDED";

        }

        // Render Loop

        function animate() {

            requestAnimationFrame(animate);

            if (gameActive) {

                handleInput();

                updateAI();

                // Dynamic Camera Focus

                if (player1 && player2) {

                    const midPoint = new THREE.Vector3().addVectors(player1.mesh.position, player2.mesh.position).multiplyScalar(0.5);

                    camera.position.x = midPoint.x;

                    camera.position.z = Math.max(10, Math.abs(player1.mesh.position.x - player2.mesh.position.x) + 6);

                    camera.lookAt(midPoint);

                }

            } else {

                // Menu Background Camera Rotation

                const time = Date.now() * 0.0005;

                camera.position.x = Math.sin(time) * 15;

                camera.position.z = Math.cos(time) * 15;

                camera.lookAt(0, 0, 0);

            }

            renderer.render(scene, camera);

        }

        // Initialization Logic

        window.onload = () => {

            initRosterUI();

            init3DEngine();

            animate();

            document.getElementById('start-fight-btn').onclick = startMatch;

        };

    </script>
