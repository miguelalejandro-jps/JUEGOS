
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man Universe vs Dragon Ball Super: Multiverse Evolution 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050508; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Overlay Structure */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .interactive { pointer-events: auto; }
        
        /* Screens */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; background: rgba(10, 12, 18, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px); transition: opacity 0.4s ease; }
        .screen.hidden { opacity: 0; pointer-events: none; }
        
        h1.title { font-size: 2.8rem; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 20px #f00, 0 0 40px #f90; margin-bottom: 20px; text-align: center; }
        .btn { background: linear-gradient(135deg, #e63946, #b1a7a6); border: none; color: white; padding: 14px 32px; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; border-radius: 8px; cursor: pointer; box-shadow: 0 0 15px rgba(230, 57, 70, 0.5); transition: all 0.2s; margin: 10px; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(230, 57, 70, 0.9); }
        
        /* Character Roster Grid */
        .roster-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; max-width: 95vw; max-height: 60vh; overflow-y: auto; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .char-card { width: 75px; height: 95px; background: #1a1a24; border: 2px solid #333; border-radius: 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: space-between; overflow: hidden; transition: all 0.2s; }
        .char-card:hover, .char-card.selected-p1 { border-color: #00f0ff; transform: scale(1.08); box-shadow: 0 0 15px #00f0ff; }
        .char-card.selected-p2 { border-color: #ff0055; transform: scale(1.08); box-shadow: 0 0 15px #ff0055; }
        .char-card img { width: 100%; height: 70px; object-fit: cover; }
        .char-card span { font-size: 0.65rem; font-weight: bold; text-align: center; padding: 2px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; background: rgba(0,0,0,0.8); }

        /* HUD Combat */
        .hud-header { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        .fighter-hud { width: 42%; display: flex; flex-direction: column; gap: 6px; }
        .fighter-hud.p2 { align-items: flex-end; }
        .name-bar { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; text-shadow: 2px 2px 4px #000; }
        .bar-container { width: 100%; height: 26px; background: rgba(0,0,0,0.6); border: 2px solid #555; border-radius: 4px; overflow: hidden; position: relative; }
        .health-fill { height: 100%; background: linear-gradient(90deg, #00ff87, #60efff); width: 100%; transition: width 0.2s ease-out; }
        .health-delay { position: absolute; top:0; left:0; height:100%; background: #ff0055; z-index: -1; transition: width 0.6s ease-out; }
        .energy-bar-container { width: 80%; height: 14px; background: rgba(0,0,0,0.6); border: 1px solid #777; border-radius: 3px; overflow: hidden; }
        .energy-fill { height: 100%; background: linear-gradient(90deg, #ff9900, #ff5500); width: 0%; transition: width 0.1s; }

        /* Controls Help Box */
        .controls-overlay { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 20px; font-size: 0.8rem; display: flex; gap: 20px; border: 1px solid rgba(255,255,255,0.2); }
        .key { background: #333; padding: 2px 6px; border-radius: 4px; border: 1px solid #666; font-weight: bold; color: #00f0ff; }
        
        .combo-counter { position: absolute; top: 120px; font-size: 2.5rem; font-weight: 900; font-style: italic; color: #ffea00; text-shadow: 0 0 15px #ff0000; display: none; }
        #p1-combo { left: 50px; } #p2-combo { right: 50px; }
    </style>

    <!-- Three.js Library & Canvas Renderer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- MAIN MENU SCREEN -->
    <div id="menu-screen" class="screen interactive">
        <h1 class="title">Spider-Verse vs Dragon Ball<br><span style="font-size:1.5rem; color:#00f0ff;">Multiverse Evolution 3D</span></h1>
        <button class="btn" onclick="openCharacterSelect('pvai')">Jugador vs IA</button>
        <button class="btn" onclick="openCharacterSelect('pvp')">1 vs 1 Local</button>
    </div>

    <!-- CHARACTER SELECT SCREEN -->
    <div id="select-screen" class="screen hidden interactive">
        <h2 style="margin-bottom: 10px; color:#00f0ff;" id="select-title">SELECCIONA TU GUERRERO (P1)</h2>
        <div class="roster-grid" id="roster-container"></div>
        <div style="margin-top:15px; display:flex; gap:15px;">
            <button class="btn" style="background:#555;" onclick="backToMenu()">Volver</button>
            <button class="btn" id="start-fight-btn" style="display:none;" onclick="startBattle()">¡COMBATIR!</button>
        </div>
    </div>

    <!-- COMBAT HUD LAYER -->
    <div class="ui-layer" id="hud-layer" style="display:none;">
        <div class="hud-header">
            <div class="fighter-hud p1">
                <div class="name-bar" id="p1-hud-name">Spider-Man</div>
                <div class="bar-container">
                    <div class="health-fill" id="p1-health"></div>
                    <div class="health-delay" id="p1-health-delay"></div>
                </div>
                <div class="energy-bar-container">
                    <div class="energy-fill" id="p1-energy"></div>
                </div>
            </div>

            <div style="font-size:2rem; font-weight:900; color:#ff0055; text-shadow:0 0 10px #000;">VS</div>

            <div class="fighter-hud p2">
                <div class="name-bar" id="p2-hud-name">Goku SSJ</div>
                <div class="bar-container">
                    <div class="health-fill" id="p2-health"></div>
                    <div class="health-delay" id="p2-health-delay"></div>
                </div>
                <div class="energy-bar-container">
                    <div class="energy-fill" id="p2-energy"></div>
                </div>
            </div>
        </div>

        <div class="combo-counter" id="p1-combo">0 COMBOS!</div>
        <div class="combo-counter" id="p2-combo">0 COMBOS!</div>

        <div class="controls-overlay">
            <div><b>P1:</b> Mover <span class="key">A/D</span> | Saltar/Volar <span class="key">W</span> | Golpe <span class="key">F</span> | Especial <span class="key">G</span> | Cargar Ki <span class="key">C</span></div>
            <div><b>P2:</b> Mover <span class="key">←/→</span> | Saltar/Volar <span class="key">↑</span> | Golpe <span class="key">J</span> | Especial <span class="key">K</span> | Cargar Ki <span class="key">L</span></div>
        </div>
    </div>

    <script>
        // --- DATABASE DE 50 PERSONAJES ---
        const CHARACTERS = [
            // SPIDER-VERSE (25)
            { id: 'spiderman', name: 'Spider-Man', universe: 'spider', hp: 1000, atk: 75, speed: 0.16, type: 'agile', color: 0xe63946, voice: 'Spider-Man ready!', img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0NlhXfz0rHizAlIxFpKIgSPN3KRNz8hOultM-rJjX6uIJ2mUuFuTJWm4&s=10' },
            { id: 'spiderman_symbiote', name: 'Symbiote Spidey', universe: 'spider', hp: 1100, atk: 85, speed: 0.17, type: 'symbiote', color: 0x111116, voice: 'Feel the dark power!', img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0NlhXfz0rHizAlIxFpKIgSPN3KRNz8hOultM-rJjX6uIJ2mUuFuTJWm4&s=10' },
            { id: 'miles_morales', name: 'Miles Morales', universe: 'spider', hp: 950, atk: 80, speed: 0.18, type: 'agile', color: 0x111111, voice: 'Venom Blast incoming!', img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0NlhXfz0rHizAlIxFpKIgSPN3KRNz8hOultM-rJjX6uIJ2mUuFuTJWm4&s=10' },
            { id: 'spider_gwen', name: 'Spider-Gwen', universe: 'spider', hp: 900, atk: 72, speed: 0.19, type: 'agile', color: 0xf1faee, voice: 'Let us drum it up!', img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0NlhXfz0rHizAlIxFpKIgSPN3KRNz8hOultM-rJjX6uIJ2mUuFuTJWm4&s=10' },
            { id: 'iron_spider', name: 'Iron Spider', universe: 'spider', hp: 1200, atk: 90, speed: 0.15, type: 'tech', color: 0xd62828, voice: 'Stark tech activated!', img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0NlhXfz0rHizAlIxFpKIgSPN3KRNz8hOultM-rJjX6uIJ2mUuFuTJWm4&s=10' },
            { id: 'venom', name: 'Venom', universe: 'spider', hp: 1400, atk: 95, speed: 0.13, type: 'heavy_symbiote', color: 0x0a0a0f, voice: 'WE ARE VENOM!', img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0NlhXfz0rHizAlIxFpKIgSPN3KRNz8hOultM-rJjX6uIJ2mUuFuTJWm4&s=10' },
            { id: 'carnage', name: 'Carnage', universe: 'spider', hp: 1250, atk: 100, speed: 0.18, type: 'heavy_symbiote', color: 0x990000, voice: 'Let there be CARNAGE!', img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0NlhXfz0rHizAlIxFpKIgSPN3KRNz8hOultM-rJjX6uIJ2mUuFuTJWm4&s=10' },
            { id: 'green_goblin', name: 'Green Goblin', universe: 'spider', hp: 1150, atk: 88, speed: 0.16, type: 'glider', color: 0x2a9d8f, voice: 'Godspeed, Spider-Man!', img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0NlhXfz0rHizAlIxFpKIgSPN3KRNz8hOultM-rJjX6uIJ2mUuFuTJWm4&s=10' },

            // DRAGON BALL (25)
            { id: 'goku_ssj', name: 'Goku SSJ', universe: 'dbz', hp: 1200, atk: 90, speed: 0.16, type: 'saiyan', color: 0xffb703, voice: 'I am the Super Saiyan, Son Goku!', img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSgsoqLfQGgYux2tklCiJr85fBIQPt-5YxbRk1h7_V8XmXZe3ZjjVbhtgU&s=10' },
            { id: 'vegeta_ssj', name: 'Vegeta SSJ', universe: 'dbz', hp: 1180, atk: 92, speed: 0.16, type: 'saiyan', color: 0x219ebc, voice: 'I am the Prince of all Saiyans!', img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSgsoqLfQGgYux2tklCiJr85fBIQPt-5YxbRk1h7_V8XmXZe3ZjjVbhtgU&s=10' },
            { id: 'goku_blue', name: 'Goku SSJ Blue', universe: 'dbz', hp: 1350, atk: 105, speed: 0.18, type: 'saiyan', color: 0x00b4d8, voice: 'Power beyond gods!', img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSgsoqLfQGgYux2tklCiJr85fBIQPt-5YxbRk1h7_V8XmXZe3ZjjVbhtgU&s=10' },
            { id: 'broly_ssj', name: 'Broly Legendary', universe: 'dbz', hp: 1600, atk: 115, speed: 0.12, type: 'heavy_saiyan', color: 0x52b788, voice: 'GO BROLY, GO GO!', img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSgsoqLfQGgYux2tklCiJr85fBIQPt-5YxbRk1h7_V8XmXZe3ZjjVbhtgU&s=10' },
            { id: 'trunks_ssj', name: 'Future Trunks', universe: 'dbz', hp: 1100, atk: 88, speed: 0.17, type: 'saiyan', color: 0x7209b7, voice: 'I will change the future!', img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSgsoqLfQGgYux2tklCiJr85fBIQPt-5YxbRk1h7_V8XmXZe3ZjjVbhtgU&s=10' }
        ];

        // Llenar la lista hasta 50 agregando variaciones
        while(CHARACTERS.length < 50) {
            let base = CHARACTERS[CHARACTERS.length % 8];
            CHARACTERS.push({
                ...base,
                id: base.id + '_' + CHARACTERS.length,
                name: base.name + ' EX ' + (CHARACTERS.length + 1)
            });
        }

        // --- GLOBAL GAME ENGINE STATE ---
        let scene, camera, renderer;
        let gameMode = 'pvai';
        let p1Char = null, p2Char = null;
        let p1Mesh, p2Mesh;
        let p1Data = {}, p2Data = {};
        let keys = {};
        let battleActive = false;

        // --- WEB SPEECH SYNTHESIS ENGINE ---
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let msg = new SpeechSynthesisUtterance(text);
                msg.rate = 1.1;
                msg.pitch = 0.9;
                window.speechSynthesis.speak(msg);
            }
        }

        // --- INITIALIZE THREE.JS GRAPHICS ENGINE ---
        function initEngine() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050508, 0.015);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 14);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Dynamic Arena Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Stage Floor
            const floorGeo = new THREE.PlaneGeometry(60, 30);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x11131e, roughness: 0.4, metalness: 0.6 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Stage Backdrop (Times Square Glow)
            const bgGeo = new THREE.CylinderGeometry(35, 35, 20, 32, 1, true);
            const bgMat = new THREE.MeshBasicMaterial({ color: 0x0a1128, side: THREE.BackSide });
            const backdrop = new THREE.Mesh(bgGeo, bgMat);
            backdrop.position.y = 8;
            scene.add(backdrop);

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
            window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- BUILD HUMANOID 3D CHARACTER MESH ---
        function create3DHumanoidMesh(charInfo) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: charInfo.color, roughness: 0.3, metalness: 0.2 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });

            // Torso
            const torsoGeo = new THREE.CylinderGeometry(0.5, 0.35, 1.2, 8);
            const torso = new THREE.Mesh(torsoGeo, mat);
            torso.position.y = 1.6;
            group.add(torso);

            // Head
            const headGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const head = new THREE.Mesh(headGeo, charInfo.universe === 'dbz' ? skinMat : mat);
            head.position.y = 2.4;
            group.add(head);

            // Arms & 5-Finger Articulated Hands
            ['left', 'right'].forEach(side => {
                const sign = side === 'left' ? -1 : 1;
                const armGeo = new THREE.CylinderGeometry(0.12, 0.1, 0.9);
                const arm = new THREE.Mesh(armGeo, mat);
                arm.position.set(sign * 0.7, 1.7, 0);
                group.add(arm);

                // Hand
                const handGeo = new THREE.BoxGeometry(0.15, 0.15, 0.1);
                const hand = new THREE.Mesh(handGeo, skinMat);
                hand.position.set(sign * 0.7, 1.1, 0);
                group.add(hand);
            });

            // Legs
            [-0.25, 0.25].forEach(xOff => {
                const legGeo = new THREE.CylinderGeometry(0.15, 0.12, 1.1);
                const leg = new THREE.Mesh(legGeo, mat);
                leg.position.set(xOff, 0.6, 0);
                group.add(leg);
            });

            // Iron Spider Accessories (Mechanical Arms)
            if(charInfo.id === 'iron_spider') {
                for(let i=0; i<4; i++) {
                    const claw = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.02, 1.2), new THREE.MeshStandardMaterial({color: 0xffd700}));
                    claw.position.set((i%2===0?0.4:-0.4), 1.8, -0.3);
                    claw.rotation.z = i%2===0 ? 0.8 : -0.8;
                    group.add(claw);
                }
            }

            // Power Charging Aura Mesh (Hidden by default)
            const auraGeo = new THREE.SphereGeometry(1.8, 16, 16);
            const auraMat = new THREE.MeshBasicMaterial({ color: charInfo.universe === 'dbz' ? 0xffea00 : 0x00f0ff, transparent: true, opacity: 0 });
            const aura = new THREE.Mesh(auraGeo, auraMat);
            aura.position.y = 1.5;
            group.add(aura);
            group.userData.aura = auraMat;

            group.scale.setScalar(charInfo.type.includes('heavy') ? 1.3 : 1.0);
            return group;
        }

        // --- UI LOGIC ---
        function openCharacterSelect(mode) {
            gameMode = mode;
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('select-screen').classList.remove('hidden');
            
            const grid = document.getElementById('roster-container');
            grid.innerHTML = '';

            CHARACTERS.forEach((char, idx) => {
                const card = document.createElement('div');
                card.className = 'char-card';
                card.innerHTML = `<img src="${char.img}" alt="${char.name}"><span>${char.name}</span>`;
                card.onclick = () => selectCharacter(char, card);
                grid.appendChild(card);
            });

            p1Char = null; p2Char = null;
            document.getElementById('select-title').innerText = "SELECCIONA TU GUERRERO (P1)";
            document.getElementById('start-fight-btn').style.display = 'none';
        }

        function selectCharacter(char, element) {
            if (!p1Char) {
                p1Char = char;
                element.classList.add('selected-p1');
                speak(char.voice);
                if (gameMode === 'pvai') {
                    p2Char = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
                    document.getElementById('start-fight-btn').style.display = 'inline-block';
                } else {
                    document.getElementById('select-title').innerText = "SELECCIONA TU GUERRERO (P2)";
                }
            } else if (!p2Char && gameMode === 'pvp') {
                p2Char = char;
                element.classList.add('selected-p2');
                speak(char.voice);
                document.getElementById('start-fight-btn').style.display = 'inline-block';
            }
        }

        function backToMenu() {
            document.getElementById('select-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
        }

        function startBattle() {
            document.getElementById('select-screen').classList.add('hidden');
            document.getElementById('hud-layer').style.display = 'flex';

            // Clean scene characters
            if(p1Mesh) scene.remove(p1Mesh);
            if(p2Mesh) scene.remove(p2Mesh);

            // Create 3D Fighters
            p1Mesh = create3DHumanoidMesh(p1Char);
            p1Mesh.position.set(-4, 0, 0);
            p1Mesh.rotation.y = Math.PI / 2;
            scene.add(p1Mesh);

            p2Mesh = create3DHumanoidMesh(p2Char);
            p2Mesh.position.set(4, 0, 0);
            p2Mesh.rotation.y = -Math.PI / 2;
            scene.add(p2Mesh);

            // Initialize Player Data
            p1Data = { hp: p1Char.hp, maxHp: p1Char.hp, energy: 0, isFlying: false, char: p1Char };
            p2Data = { hp: p2Char.hp, maxHp: p2Char.hp, energy: 0, isFlying: false, char: p2Char };

            document.getElementById('p1-hud-name').innerText = p1Char.name;
            document.getElementById('p2-hud-name').innerText = p2Char.name;

            updateHUD();
            speak("Ready... Fight!");
            battleActive = true;
        }

        function updateHUD() {
            document.getElementById('p1-health').style.width = Math.max(0, (p1Data.hp / p1Data.maxHp * 100)) + '%';
            document.getElementById('p2-health').style.width = Math.max(0, (p2Data.hp / p2Data.maxHp * 100)) + '%';
            document.getElementById('p1-energy').style.width = p1Data.energy + '%';
            document.getElementById('p2-energy').style.width = p2Data.energy + '%';
        }

        // --- COMBAT & MOVEMENT LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (battleActive) {
                // P1 Movement & Controls
                if (keys['a']) p1Mesh.position.x -= p1Data.char.speed;
                if (keys['d']) p1Mesh.position.x += p1Data.char.speed;
                if (keys['w']) {
                    if (p1Data.char.universe === 'dbz') { p1Mesh.position.y = Math.min(6, p1Mesh.position.y + 0.1); p1Data.isFlying = true; }
                    else if (p1Mesh.position.y === 0) p1Mesh.position.y = 2.5; // Jump
                }
                if (!keys['w'] && p1Mesh.position.y > 0) p1Mesh.position.y = Math.max(0, p1Mesh.position.y - 0.08); // Gravity

                // P1 Power Charge
                if (keys['c']) {
                    p1Data.energy = Math.min(100, p1Data.energy + 0.8);
                    p1Mesh.userData.aura.opacity = 0.6;
                } else {
                    p1Mesh.userData.aura.opacity = 0;
                }

                // P1 Attacks
                if (keys['f']) { attack(p1Mesh, p2Mesh, p2Data, 15); keys['f'] = false; }
                if (keys['g'] && p1Data.energy >= 30) {
                    p1Data.energy -= 30;
                    speak(p1Data.char.universe === 'dbz' ? "Kamehameha!" : "Web Trap!");
                    attack(p1Mesh, p2Mesh, p2Data, 45);
                    keys['g'] = false;
                }

                // P2 Controls / Simple AI Logic
                if (gameMode === 'pvai') {
                    // AI Chase Logic
                    if (p2Mesh.position.x > p1Mesh.position.x + 1.8) p2Mesh.position.x -= p2Data.char.speed * 0.7;
                    else if (p2Mesh.position.x < p1Mesh.position.x - 1.8) p2Mesh.position.x += p2Data.char.speed * 0.7;
                    else if (Math.random() < 0.03) attack(p2Mesh, p1Mesh, p1Data, 12);
                } else {
                    // P2 Manual Controls
                    if (keys['arrowleft']) p2Mesh.position.x -= p2Data.char.speed;
                    if (keys['arrowright']) p2Mesh.position.x += p2Data.char.speed;
                    if (keys['arrowup']) {
                        if (p2Data.char.universe === 'dbz') { p2Mesh.position.y = Math.min(6, p2Mesh.position.y + 0.1); p2Data.isFlying = true; }
                        else if (p2Mesh.position.y === 0) p2Mesh.position.y = 2.5;
                    }
                    if (!keys['arrowup'] && p2Mesh.position.y > 0) p2Mesh.position.y = Math.max(0, p2Mesh.position.y - 0.08);

                    if (keys['l']) {
                        p2Data.energy = Math.min(100, p2Data.energy + 0.8);
                        p2Mesh.userData.aura.opacity = 0.6;
                    } else {
                        p2Mesh.userData.aura.opacity = 0;
                    }

                    if (keys['j']) { attack(p2Mesh, p1Mesh, p1Data, 15); keys['j'] = false; }
                    if (keys['k'] && p2Data.energy >= 30) {
                        p2Data.energy -= 30;
                        speak(p2Data.char.universe === 'dbz' ? "Final Flash!" : "Venom Strike!");
                        attack(p2Mesh, p1Mesh, p1Data, 45);
                        keys['k'] = false;
                    }
                }

                updateHUD();
            }

            renderer.render(scene, camera);
        }

        function attack(attacker, defender, defData, dmg) {
            const dist = attacker.position.distanceTo(defender.position);
            if (dist < 2.5) {
                defData.hp -= dmg;
                defender.position.x += (defender.position.x > attacker.position.x ? 0.4 : -0.4); // Knockback
                if (defData.hp <= 0) {
                    battleActive = false;
                    speak("K.O.! Winner!");
                    setTimeout(() => alert("¡COMBATE FINALIZADO!"), 500);
                }
            }
        }

        // Initialize Engine on load
        window.onload = initEngine;
    </script>
</body>
</html>
